{% extends 'catalog/base.html'%}

{% block title %}Главная страница{% endblock %}

{% block content %}
{% include 'catalog/header.html'%}
{% for product in products %}
<div class="col-md-6 col-lg-4">
    <div class="card" style="width: 18rem;">
        <img src='{{ product.photo }}' class="card-img-top" width="100%" height="250" alt="{{product.name_product|upper}}">
        <div class="card-body d-flex flex-column">
            <h5 class="card-title text-center my-3">{{product.name_product|upper}} {{product.price}}</h5>
            <p class="card-text text-center flex-grow-1">{{ product.description|truncatechars:100 }}</p>
            <div class="text-center mt-auto">
                <a href="#" class="btn btn-outline-primary w-75">
                    <i class="fas fa-shopping-cart me-2"></i>Заказать
                </a>
            </div>
        </div>
    </div>
</div>
{% endfor %}
{% endblock %}
