{% extends 'blog/base.html' %}
{% load my_tags %}
{% block title %}{{ object.title }}{% endblock %}

{% block content %}
<div class="container">
    <h2 class="text-center mb-4">{{ object.title }}</h2>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card mb-5 border-0 shadow-sm">
                <!-- Изображение поста -->
                <div class="card-img-container"
                     style="height: 400px; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #f8f9fa;">
                    <img src='{{ object.preview_image|media_filter }}'
                         class="card-img-top"
                         style="max-height: 100%; max-width: 100%; object-fit: contain;"
                         alt="{{ object.title }}">
                </div>

                <!-- Тело поста -->
                <div class="card-body">
                    <!-- Мета-информация -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="badge bg-primary me-2">Category</span>
                            <small class="text-muted">
                                <i class="far fa-calendar-alt me-1"></i>
                                {{ object.created_at|date:"d E Y" }}
                            </small>
                        </div>
                        <div>
                            <small class="text-muted">
                                <i class="far fa-eye me-1"></i> {{ object.views }}
                            </small>
                        </div>
                    </div>

                    <!-- Содержимое поста -->
                    <div class="post-content mb-4">
                        {{ object.content|safe }}
                    </div>
                    <!-- Кнопки -->
                    <div class="d-flex justify-content-between align-items-center border-top pt-3">
                        <div class="btn-group">
                            <a href="{% url 'blog:post_list' %}" class="btn btn-outline-secondary btn-sm">
                                <i class="fas fa-arrow-left me-1"></i> Назад к списку
                            </a>
                            <a href="{% url 'blog:post_edit' object.pk %}" class="btn btn-outline-primary btn-sm ms-2">
                                <i class="far fa-edit me-1"></i> Редактировать
                            </a>
                            <a href="{% url 'blog:post_confirm_delete' object.pk %}" class="btn btn-outline-danger btn-sm ms-2">
                                <i class="far fa-trash-alt me-1"></i> Удалить
                            </a>
                        </div>
                        <small class="text-muted">
                            Автор: <a href="#">Auther</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .post-content img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 1rem 0;
    }
    .card-img-container {
        border-radius: 8px 8px 0 0;
    }
</style>
{% endblock %}
