<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой Блог{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .main-container {
            display: flex;
            flex: 1;
        }
        .sidebar {
            width: 250px;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .content {
            flex: 1;
            padding: 20px;
        }
        .post-img {
            max-height: 300px;
            object-fit: cover;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Хедер -->
    <header class="bg-dark text-white p-3">
        <div class="container">
            <h1>Мой Блог</h1>
        </div>
    </header>

    <!-- Навбар -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'blog:post_list' %}">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">О нас</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Контакты</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="main-container">
        <!-- Сайдбар -->
      <aside class="sidebar bg-light p-4 shadow-sm" style="width: 280px;">
        <h4 class="mb-4 border-bottom pb-2 d-flex align-items-center">
          <i class="fas fa-folder-open me-2 text-primary"></i>
          Категории
        </h4>

        <ul class="nav flex-column">
          <li class="nav-item mb-2">
            <a href="{% url 'blog:post_list' %}" class="nav-link text-dark p-2 rounded d-flex align-items-center">
              <i class="fas fa-list-ul me-3 text-muted"></i>
              Все посты
              <span class="badge bg-primary ms-auto"></span>
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link text-dark p-2 rounded d-flex align-items-center active">
              <i class="fas fa-fire me-3 text-danger"></i>
              Популярные
              <span class="badge bg-danger ms-auto"></span>
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link text-dark p-2 rounded d-flex align-items-center">
              <i class="fas fa-bolt me-3 text-warning"></i>
              Новинки
              <span class="badge bg-success ms-auto"></span>
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link text-dark p-2 rounded d-flex align-items-center">
              <i class="far fa-star me-3 text-info"></i>
              Избранное
            </a>
          </li>
            <li class="nav-item mb-2">
                <a href="{% url 'blog:post_form' %}" class="nav-link text-dark p-2 rounded d-flex align-items-center">
                    <i class="far fa-plus-circle me-3 text-info"></i>
                    Добавить пост
                </a>
            </li>
        </ul>
      </aside>

        <!-- Контент-область -->
        <main class="content">
            {% block content %}
            <!-- Сюда будет подставляться контент из дочерних шаблонов -->
            {% endblock %}
        </main>
    </div>

    <!-- Футер -->
    <footer class="bg-dark text-white p-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2023 Мой Блог. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
